url: https://connorb.github.io/streamMetabolizer/
llm-docs: true
authors:
  Connor Brown:
    href: https://connorb.github.io/
  Alison P. Appling:
    href: https://www.usgs.gov/staff-profiles/alison-appling
  Robert O. Hall:
    href: https://robohall.github.io/
  Charles B. Yackulic:
    href: https://www.usgs.gov/staff-profiles/charles-b-yackulic
  Maite Arroita:
    href: https://www.ehu.eus/streamecology/maite-arroita.html
template:
  bootstrap: 5
  bslib:
    base_font: {google: "Roboto"}
    heading_font: {google: "Roboto Slab"}
    code_font: {google: "Fira Code"}
  light-switch: true
  math-rendering: mathjax
  includes:
    in_header: |
      <script>
          window.goatcounter = {
              path: function(p) { return location.host + p }
          }
      </script>
      <script data-goatcounter="https://connor.goatcounter.com/count"
              async src="//gc.zgo.at/count.js"></script>

deploy:
  install_metadata: true

development:
  mode: auto
reference:
- title: Plotting
- contents:
  - plot_DO_preds
  - plot_distribs
  - plot_metab_data
  - plot_metab_preds
- title: Other
- contents:
  - matches(".")
  - -plot_DO_preds
  - -plot_distribs
  - -plot_metab_data
  - -plot_metab_preds
